# Script 3.3 — Nginx rate limiting for LLM bots
# Companion code for "Answer Engine Optimization" (O'Reilly) — Chapter 3
#
# Throttles training-only crawlers while giving real-time retrieval
# bots generous limits. Drop the map{} and limit_req_zone directives
# into the http{} context (e.g., /etc/nginx/conf.d/llm-bots.conf),
# and apply the named locations from your server block.

# Step 1: Map user agents to bot categories
map $http_user_agent $is_training_bot {
    default          0;
    "~*GPTBot"       1;
    "~*Bytespider"   1;
    "~*ClaudeBot"    1;
    "~*cohere-ai"    1;
}

map $http_user_agent $is_realtime_bot {
    default            0;
    "~*ChatGPT-User"   1;
    "~*PerplexityBot"  1;
    "~*OAI-SearchBot"  1;
    "~*Claude-Web"     1;
}

# Step 2: Create rate limit zones
limit_req_zone $binary_remote_addr zone=training_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=realtime_limit:10m rate=50r/s;

server {
    # Step 3: Apply rate limits in separate location blocks

    # Training bots get throttled
    location @training_limited {
        limit_req zone=training_limit burst=10 nodelay;
    }

    # Real-time bots get generous limits
    location @realtime_limited {
        limit_req zone=realtime_limit burst=20 nodelay;
    }
}
